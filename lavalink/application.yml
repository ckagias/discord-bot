server:
  port: 2333
  address: 0.0.0.0

lavalink:
  # youtube-plugin is NOT downloaded from Maven. lavalink/plugins/ holds a jar built from
  # lavalink-devs/youtube-source main (e41dd95) with AndroidVr.CLIENT_VERSION 1.60.19 -> 1.65.10,
  # because YouTube bot-checks 1.60.19 (upstream issue #255). Go back to a Maven
  # `dev.lavalink.youtube:youtube-plugin:<version>` dependency once a release ships that fix.
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false  # plugin handles youtube
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - IOS  # must stay after ANDROID_VR: IOS first makes ytsearch return empty (upstream #250)
      - TVHTML5_SIMPLY

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    max-history: 30
    max-size: 1GB
  path: ./logs/
  level:
    root: INFO
    lavalink: INFO