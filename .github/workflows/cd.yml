name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    steps:
      - name: Pull latest and restart services
        run: |
          cd "${{ secrets.DEPLOY_PATH }}"
          git pull origin main
          ./restart.sh
